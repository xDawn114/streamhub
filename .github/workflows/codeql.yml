name: Product CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  csharp:
    name: Windows C# (manual build)
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned upstream action; reviewed stage120
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # pinned upstream action; reviewed stage120
        with:
          dotnet-version: '8.0.x'
      # v4 annotated tag peeled to the commit via read-only git ls-remote, 2026-11-13.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: csharp
          build-mode: manual
          config-file: ./.github/codeql/csharp.yml
      - name: Compile owned Windows projects without installation or tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($project in @('host/StreamHub.Host.csproj', 'service/StreamHub.Service.csproj', 'installer/StreamHub.Installer.csproj')) {
            dotnet build $project -c Release --no-incremental -p:PayloadMode=Uninstaller -p:UseSharedCompilation=false
            if ($LASTEXITCODE -ne 0) { throw "CodeQL compilation failed: $project" }
          }
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: /language:csharp/product-windows

  java:
    name: Android Java (source analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned upstream action; reviewed stage120
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: java-kotlin
          build-mode: none
          config-file: ./.github/codeql/java.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: /language:java/product-android-source
