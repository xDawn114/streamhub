name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-source:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows app, service and uninstaller (no installation)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($project in @('host/StreamHub.Host.csproj', 'service/StreamHub.Service.csproj', 'installer/StreamHub.Installer.csproj')) {
            dotnet build $project -c Release -p:PayloadMode=Uninstaller
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }
      - name: Check desktop input policy without accessing the desktop
        shell: pwsh
        run: |
          dotnet run --project tests/desktop-input/DesktopInputChecks.csproj -c Release -- service/bin/Release/net8.0-windows/串流中心后台.dll
          if ($LASTEXITCODE -ne 0) { throw 'Desktop policy checks failed' }
      - name: Check themes, dropdown geometry and nested Escape handling offscreen
        shell: pwsh
        run: |
          dotnet run --project tests/theme-controls/ThemeControlChecks.csproj -c Release -- (Join-Path $env:RUNNER_TEMP 'icontrol-theme-controls')
          if ($LASTEXITCODE -ne 0) { throw 'Theme and keyboard routing checks failed' }
      - name: Check isolated control boundary, computer policies and firewall rules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($project in @('tests/control-boundary/ControlBoundaryChecks.csproj', 'tests/host-policy/HostPolicyChecks.csproj', 'tests/firewall/FirewallChecks.csproj')) {
            if (-not (Test-Path -LiteralPath $project -PathType Leaf)) { throw "Missing security check project: $project" }
            dotnet run --project $project -c Release
            if ($LASTEXITCODE -ne 0) { throw "Security checks failed: $project" }
          }
      - name: Check device grants and exact media revocation with isolated fixtures
        shell: pwsh
        run: |
          dotnet run --project tests/device-grants/DeviceGrantChecks.csproj -c Release -- (Join-Path $env:RUNNER_TEMP 'icontrol-device-grants')
          if ($LASTEXITCODE -ne 0) { throw 'Device grant checks failed' }
      - name: Check encoder cache migration and bounded install prewarm
        shell: pwsh
        run: |
          dotnet run --project tests/encoder-prewarm/EncoderPrewarmChecks.csproj -c Release -- (Join-Path $env:GITHUB_WORKSPACE '.tmp/encoder-prewarm-fixtures')
          if ($LASTEXITCODE -ne 0) { throw 'Encoder cache and prewarm checks failed' }
      - name: Check release catalogs and update delivery with isolated fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/publication/Run.ps1 -FixtureRoot (Join-Path $env:RUNNER_TEMP 'icontrol-release-catalogs')
          dotnet run --project tests/delivery/DeliveryChecks.csproj -c Release -- (Join-Path $env:RUNNER_TEMP 'icontrol-update-delivery')
          if ($LASTEXITCODE -ne 0) { throw 'Update delivery checks failed' }
      - name: Check signing integration refusal paths without credentials
        shell: pwsh
        run: |
          & ./tests/signing/Run.ps1 -FixtureRoot (Join-Path $env:RUNNER_TEMP 'icontrol-signing-fixtures')
      - name: Check temporary assistance lifecycle with isolated state
        shell: pwsh
        run: |
          dotnet run --project tests/assistance/AssistanceChecks.csproj -c Release -- (Join-Path $env:RUNNER_TEMP 'icontrol-assistance-fixtures')
          if ($LASTEXITCODE -ne 0) { throw 'Temporary assistance checks failed' }
      - name: Archive unsigned app and service build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-unsigned-source-checks
          path: |
            host/bin/Release/net8.0-windows/
            service/bin/Release/net8.0-windows/
          if-no-files-found: error
          retention-days: 14
